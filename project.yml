name: iSteam
options:
  bundleIdPrefix: com.Xthrx
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "16.0"
    tvOS: "17.0"
    visionOS: "1.0"
packages:
  StosSign:
    url: https://github.com/stossy11/StosSign
    branch: main
settings:
  base:
    SWIFT_VERSION: "5.9"
    ARCHS: "arm64"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: "arm64e"
targets:
  iSteam:
    type: application
    platform: iOS
    sources:
      - path: iSteam
        excludes:
          - Info.plist
          - Info-tvOS.plist
          - AppDelegate-tvOS.swift
          - LaunchSetupViewController-tvOS.swift
          - SettingsViewController-tvOS.swift
      - path: src
        excludes:
          - Display/VMDisplayViewController-tvOS.swift
    dependencies:
      - sdk: ExtensionFoundation.framework
      - sdk: XPC.framework
      - package: StosSign
        product: StosSign_API
      - package: StosSign
        product: StosSign_Auth
      - package: StosSign
        product: StosSign_Common
    postBuildScripts:
      - name: Embed bundled StikJIT helper
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          case "$PLATFORM_NAME" in iphoneos|iphonesimulator) ;; *) exit 0 ;; esac
          case "$PRODUCT_BUNDLE_IDENTIFIER" in
            com.xthrx.isteam.nightly) helper_name="AkatsubakiJITHelperNightly.appex" ;;
            *) helper_name="AkatsubakiJITHelper.appex" ;;
          esac
          helper_source="$SRCROOT/Vendor/Helpers/$PLATFORM_NAME/$helper_name"
          helper_destination="$TARGET_BUILD_DIR/$WRAPPER_NAME/Extensions/$helper_name"
          if [ ! -d "$helper_source" ]; then
            echo "error: Missing StikJIT helper at $helper_source. Build it with scripts/build_stikjit_helper.sh using Xcode 27.1." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$helper_destination")"
          /usr/bin/rsync -a --delete "$helper_source/" "$helper_destination/"
    settings:
      base:
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam
        PRODUCT_NAME: iSteam
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit", "-framework", "Security", "-Wl,-exported_symbol,_iSteamJITIsSupported", "-Wl,-exported_symbol,_iSteamJITGetProtocolMode", "-Wl,-exported_symbol,_iSteamJITSetProtocolOverride", "-Wl,-exported_symbol,_iSteamJITIsReady", "-Wl,-exported_symbol,_iSteamJITPrepareRegion", "-Wl,-exported_symbol,_iSteamJITDetach"]
  iSteamNightly:
    type: application
    platform: iOS
    sources:
      - path: iSteam
        excludes:
          - Info.plist
          - Info-tvOS.plist
          - AppDelegate-tvOS.swift
          - LaunchSetupViewController-tvOS.swift
          - SettingsViewController-tvOS.swift
      - path: src
        excludes:
          - Display/VMDisplayViewController-tvOS.swift
    dependencies:
      - sdk: ExtensionFoundation.framework
      - sdk: XPC.framework
      - package: StosSign
        product: StosSign_API
      - package: StosSign
        product: StosSign_Auth
      - package: StosSign
        product: StosSign_Common
    postBuildScripts:
      - name: Embed bundled StikJIT helper
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          case "$PLATFORM_NAME" in iphoneos|iphonesimulator) ;; *) exit 0 ;; esac
          case "$PRODUCT_BUNDLE_IDENTIFIER" in
            com.xthrx.isteam.nightly) helper_name="AkatsubakiJITHelperNightly.appex" ;;
            *) helper_name="AkatsubakiJITHelper.appex" ;;
          esac
          helper_source="$SRCROOT/Vendor/Helpers/$PLATFORM_NAME/$helper_name"
          helper_destination="$TARGET_BUILD_DIR/$WRAPPER_NAME/Extensions/$helper_name"
          if [ ! -d "$helper_source" ]; then
            echo "error: Missing StikJIT helper at $helper_source. Build it with scripts/build_stikjit_helper.sh using Xcode 27.1." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$helper_destination")"
          /usr/bin/rsync -a --delete "$helper_source/" "$helper_destination/"
    settings:
      base:
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.nightly
        PRODUCT_NAME: iSteam
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu Nightly
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit", "-framework", "Security", "-Wl,-exported_symbol,_iSteamJITIsSupported", "-Wl,-exported_symbol,_iSteamJITGetProtocolMode", "-Wl,-exported_symbol,_iSteamJITSetProtocolOverride", "-Wl,-exported_symbol,_iSteamJITIsReady", "-Wl,-exported_symbol,_iSteamJITPrepareRegion", "-Wl,-exported_symbol,_iSteamJITDetach"]
  iSteamTV:
    type: application
    platform: tvOS
    sources:
      - path: tvOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.tvos
        PRODUCT_NAME: iSteamTV
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu tvOS
        INFOPLIST_FILE: iSteam/Info-tvOS.plist

  iSteamVision:
    type: application
    platform: visionOS
    sources:
      - path: iSteam
        excludes:
          - BuiltInJITHelperClient.swift
          - BuiltInJITSettingsView.swift
          - JITHelperExtensionPoint.swift
          - JITHelperIPC.swift
          - StikJITPairingFileStore.swift
          - Info.plist
          - Info-tvOS.plist
          - AppDelegate-tvOS.swift
          - LaunchSetupViewController-tvOS.swift
          - SettingsViewController-tvOS.swift
          - EntitlementSettingsView.swift
      - path: src
        excludes:
          - Display/VMDisplayViewController-tvOS.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.visionos
        PRODUCT_NAME: iSteamVision
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu visionOS
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit"]
