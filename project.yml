name: iSteam
options:
  minimumXcodeGenVersion: 2.40.0
  bundleIdPrefix: com.Xthrx
  xcodeVersion: "27.1"
  deploymentTarget:
    iOS: "16.0"
    tvOS: "17.0"
    visionOS: "1.0"
packages:
  StosSign:
    url: https://github.com/stossy11/StosSign
    branch: main
settings:
  base:
    SWIFT_VERSION: "5.9"
    ARCHS: "arm64"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: "arm64e"
targets:
  iSteam:
    type: application
    platform: iOS
    sources:
      - path: iSteam
        excludes:
          - Info.plist
          - Info-tvOS.plist
          - AppDelegate-tvOS.swift
          - LaunchSetupViewController-tvOS.swift
          - SettingsViewController-tvOS.swift
      - path: src
        excludes:
          - Display/VMDisplayViewController-tvOS.swift
    dependencies:
      - framework: build/dependencies/AkatsubakiPairingFFI.xcframework
      - package: StosSign
        product: StosSign_API
      - package: StosSign
        product: StosSign_Auth
      - package: StosSign
        product: StosSign_Common
      - sdk: IOKit.framework
      - target: iSteamJITHelper
        embed: true
    settings:
      base:
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam
        PRODUCT_NAME: iSteam
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit", "-framework", "Security", "-Wl,-exported_symbol,_iSteamJITIsSupported", "-Wl,-exported_symbol,_iSteamJITGetProtocolMode", "-Wl,-exported_symbol,_iSteamJITIsReady", "-Wl,-exported_symbol,_iSteamJITPrepareRegion", "-Wl,-exported_symbol,_iSteamJITDetach"]
  iSteamNightly:
    type: application
    platform: iOS
    sources:
      - path: iSteam
        excludes:
          - Info.plist
          - Info-tvOS.plist
          - AppDelegate-tvOS.swift
          - LaunchSetupViewController-tvOS.swift
          - SettingsViewController-tvOS.swift
      - path: src
        excludes:
          - Display/VMDisplayViewController-tvOS.swift
    dependencies:
      - framework: build/dependencies/AkatsubakiPairingFFI.xcframework
      - package: StosSign
        product: StosSign_API
      - package: StosSign
        product: StosSign_Auth
      - package: StosSign
        product: StosSign_Common
      - sdk: IOKit.framework
      - target: iSteamNightlyJITHelper
        embed: true
    settings:
      base:
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.nightly
        PRODUCT_NAME: iSteam
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu Nightly
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit", "-framework", "Security", "-Wl,-exported_symbol,_iSteamJITIsSupported", "-Wl,-exported_symbol,_iSteamJITGetProtocolMode", "-Wl,-exported_symbol,_iSteamJITIsReady", "-Wl,-exported_symbol,_iSteamJITPrepareRegion", "-Wl,-exported_symbol,_iSteamJITDetach"]
  iSteamJITHelper:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iSteamJITHelper/Shared
      - path: iSteamJITHelper/Helper
    dependencies:
      - framework: build/dependencies/StikJIT.xcframework
        embed: true
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.jithelper
        PRODUCT_NAME: AkatsubakiJITHelper
        INFOPLIST_FILE: iSteamJITHelper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: NO

  iSteamNightlyJITHelper:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iSteamJITHelper/Shared
      - path: iSteamJITHelper/Helper
    dependencies:
      - framework: build/dependencies/StikJIT.xcframework
        embed: true
      - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.nightly.jithelper
        PRODUCT_NAME: AkatsubakiJITHelper
        INFOPLIST_FILE: iSteamJITHelper/Info-nightly.plist
        GENERATE_INFOPLIST_FILE: NO
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NIGHTLY_BUILD"
        SKIP_INSTALL: NO

  iSteamTV:
    type: application
    platform: tvOS
    sources:
      - path: tvOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.tvos
        PRODUCT_NAME: iSteamTV
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu tvOS
        INFOPLIST_FILE: iSteam/Info-tvOS.plist

  iSteamVision:
    type: application
    platform: visionOS
    sources:
      - path: iSteam
        excludes:
          - Info.plist
          - Info-tvOS.plist
          - AppDelegate-tvOS.swift
          - LaunchSetupViewController-tvOS.swift
          - SettingsViewController-tvOS.swift
          - EntitlementSettingsView.swift
      - path: src
        excludes:
          - Display/VMDisplayViewController-tvOS.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xthrx.isteam.visionos
        PRODUCT_NAME: iSteamVision
        INFOPLIST_KEY_CFBundleDisplayName: Akatsubaki Emu visionOS
        INFOPLIST_FILE: iSteam/Info.plist
        CODE_SIGN_ENTITLEMENTS: iSteam/iSteam.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: iSteam/iSteam-Bridging-Header.h
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-framework", "Metal", "-framework", "MetalKit"]
