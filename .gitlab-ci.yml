spec:
  inputs:
    channel:
      description: "Choose the release channel. iOS, tvOS and visionOS will be built."
      type: string
      options: [Nightly, Main]
      default: Nightly
---
stages:
  - validate

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

swift-runtime-tests:
  stage: validate
  image: swift:6.0
  interruptible: true
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: never
    - changes:
        - src/Runtime/*.swift
        - src/Runtime/**/*.swift
        - src/Performance/*.swift
        - src/GPU/*.swift
        - src/Display/TouchStickMath.swift
        - src/QEMU/VNCKeyState.swift
        - scripts/tests/*.swift
        - scripts/tests/**/*.swift
    - when: never
  script:
    - python3 scripts/validate-qemu-source.py
    - swiftc -parse-as-library -swift-version 5 src/Runtime/ELF64Loader.swift scripts/tests/test_elf_loader_program_headers.swift -o /tmp/test-elf-phdr
    - /tmp/test-elf-phdr
    - swiftc -parse-as-library -swift-version 5 src/QEMU/VNCKeyState.swift scripts/tests/test_vnc_key_state.swift -o /tmp/test-vnc-key-state
    - /tmp/test-vnc-key-state
    - swiftc -parse-as-library -swift-version 5 src/Runtime/WindowsPEImage.swift scripts/tests/test_windows_pe_image.swift -o /tmp/test-windows-pe
    - /tmp/test-windows-pe
    - swiftc -parse-as-library -swift-version 5 src/Runtime/ELF64Loader.swift src/Runtime/X86_64ALU.swift src/Runtime/LinuxProcessStackBuilder.swift src/Runtime/LinuxSyscallDispatcher.swift src/Runtime/X86_64Interpreter.swift scripts/tests/test_static_elf_execution.swift -o /tmp/test-static-elf
    - /tmp/test-static-elf
    - swiftc -parse-as-library -swift-version 5 src/Runtime/X86_64AOTTranslator.swift scripts/tests/test_kenran_buto_aot_translator.swift -o /tmp/test-kenran-buto-aot
    - /tmp/test-kenran-buto-aot
    - swiftc -parse-as-library -swift-version 5 src/Runtime/X86_64ALU.swift src/Runtime/LinuxSyscallDispatcher.swift src/Runtime/X86_64Interpreter.swift scripts/tests/test_x86_64_interpreter.swift -o /tmp/test-x86-interpreter
    - /tmp/test-x86-interpreter
    - swiftc -parse-as-library -swift-version 5 src/Runtime/LinuxProcessStackBuilder.swift scripts/tests/test_linux_process_stack.swift -o /tmp/test-linux-stack
    - /tmp/test-linux-stack
    - swiftc -parse-as-library -swift-version 5 src/Runtime/LinuxSyscallDispatcher.swift scripts/tests/test_linux_syscall_dispatcher.swift -o /tmp/test-linux-syscalls
    - /tmp/test-linux-syscalls
    - swiftc -parse-as-library -swift-version 5 src/Runtime/ExecutionBackendRouter.swift scripts/tests/test_execution_backend_router.swift -o /tmp/test-backend-router
    - /tmp/test-backend-router
    - swiftc -parse-as-library -swift-version 5 src/Runtime/KenranButoAOT.swift scripts/tests/test_kenran_buto_aot.swift -o /tmp/test-kenran-buto-aot
    - /tmp/test-kenran-buto-aot
    - swiftc -parse-as-library -swift-version 5 src/GPU/GPUBackend.swift scripts/tests/test_gpu_frame_region.swift -o /tmp/test-gpu-frame-region
    - /tmp/test-gpu-frame-region
    - swiftc -parse-as-library -swift-version 5 src/Display/TouchStickMath.swift scripts/tests/test_touch_stick_math.swift -o /tmp/test-touch-stick
    - /tmp/test-touch-stick

native-memory-tests:
  stage: validate
  image: gcc:14
  interruptible: true
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
      when: never
    - changes:
        - iSteam/NativeGuestMemory.cpp
        - iSteam/NativeGuestMemory.h
        - scripts/tests/test_native_guest_memory.cpp
    - when: never
  script:
    - g++ -std=c++17 -Wall -Wextra -Werror -IiSteam iSteam/NativeGuestMemory.cpp scripts/tests/test_native_guest_memory.cpp -o /tmp/test-native-memory
    - /tmp/test-native-memory

python-source-contracts:
  stage: validate
  image: python:3.12-slim
  interruptible: true
  timeout: 5m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - changes:
        - .gitlab-ci.yml
        - .github/workflows/**/*
        - project.yml
        - src/**/*
        - iSteam/**/*
        - scripts/**/*
    - when: never
  script:
    - apt-get update && apt-get install -y --no-install-recommends bash build-essential && rm -rf /var/lib/apt/lists/*
    - bash -n scripts/package-utm-qemu-runtime.sh scripts/validate-qemu-runtime.sh scripts/validate-apple-package.sh
    - python -m py_compile scripts/validate-qemu-source.py
    - python scripts/validate-qemu-source.py
    - python -m unittest discover -s scripts/tests -p 'test_*.py'
    - cc -std=c11 -Wall -Wextra -Werror -pthread -IiSteam iSteam/QEMUNativeBridge.c scripts/tests/test_qemu_native_bridge.c -ldl -o /tmp/test-qemu-native-bridge
    - cc -std=c11 -Wall -Wextra -Werror -fPIC -shared scripts/tests/fake_qemu_runtime.c -o /tmp/libfake-qemu-runtime.so
    - /tmp/test-qemu-native-bridge /tmp/libfake-qemu-runtime.so
