stages:
  - validate

workflow:
  rules:
    - if: '($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $CI_COMMIT_BRANCH == "main"'
    - when: never

core-source-and-elf-validation:
  stage: validate
  image: python:3.12
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  timeout: 20m
  script:
    - python3 --version
    - bash -n scripts/build_fexcore_ios.sh
    - mkdir -p build
    - cc -std=c11 -Wall -Wextra -Werror -pthread -IiSteam iSteam/AOTExecutableArena.c scripts/tests/test_aot_executable_arena.c -o build/test_aot_executable_arena
    - ./build/test_aot_executable_arena
    - python3 scripts/build_hybrid_xchg_smoke_elf.py build/hybrid_xchg_smoke.elf
    - ./build/hybrid_xchg_smoke.elf
    - python3 scripts/build_hybrid_runtime_smoke_elf.py build/hybrid_runtime_smoke.elf
    - ./build/hybrid_runtime_smoke.elf
    - python3 scripts/validate-qemu-source.py
    - python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
    - cc -std=c11 -Wall -Wextra -Werror -pthread -fPIC -shared scripts/tests/fake_qemu_runtime.c -o build/libfakeqemu-jit.so
    - cc -std=c11 -Wall -Wextra -Werror -pthread -DFAKE_QEMU_NO_JIT_CALLBACK -fPIC -shared scripts/tests/fake_qemu_runtime.c -o build/libfakeqemu-tci.so
    - cc -std=c11 -Wall -Wextra -Werror -pthread -IiSteam iSteam/QEMUNativeBridge.c scripts/tests/test_qemu_native_bridge.c -ldl -o build/test-qemu-native-bridge
    - ./build/test-qemu-native-bridge jit build/libfakeqemu-jit.so
    - ./build/test-qemu-native-bridge tci build/libfakeqemu-tci.so
    - ./build/test-qemu-native-bridge tci-reject-jit build/libfakeqemu-jit.so
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/hybrid_xchg_smoke.elf
      - build/hybrid_runtime_smoke.elf
