name: Akatsubaki Emu Build & Release

on:
  # Build the runtime in this workflow before any platform app builds.
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  # Reconciliation may push a merge commit with GITHUB_TOKEN, which does not
  # generate a second push-triggered workflow. Re-run against the new main tip.
  workflow_run:
    workflows: ["Reconcile GitLab mirror history"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Choose which release channel to publish (iOS, tvOS and visionOS)
        type: choice
        required: true
        default: Nightly
        options:
          - Nightly
          - Main

permissions:
  # Checkouts and reusable workflows need repository read access.
  # Only the release publisher receives contents: write below.
  contents: read


jobs:
  validate-release-channel:
    name: Validate release channel
    runs-on: ubuntu-latest
    steps:
      - name: Require main ref for every release channel
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "Nightly and Main releases can only be dispatched from refs/heads/main (got $GITHUB_REF)." >&2
          exit 1

  # Record staleness for diagnostics; never use it to suppress required jobs.
  check-push-freshness:
    name: Check whether this push is still current
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.freshness.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Report whether this push is current
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          build_current="$(bash scripts/check-build-freshness.sh "$GITHUB_SHA")"
          echo "build=$build_current" >> "$GITHUB_OUTPUT"
          if [ "$build_current" != "true" ]; then
            echo "A newer build-relevant commit exists; required build jobs will still execute."
          fi

  # This reusable workflow runs inside this run and uploads the artifact here.
  # App jobs cannot start until the runtime is successfully compiled and packaged.
  qemu-runtime:
    needs: [validate-release-channel, check-push-freshness]
    # QEMU is GPL-2.0-only; gate public runtime artifacts pending compatibility review.
    # Always invoke the reusable build; licensing controls artifact publication, not execution.
    if: ${{ always() }}
    uses: ./.github/workflows/build-qemu-runtime.yml
    with:
      rebuild_dependencies: false

  # QEMU can take hours to compile. Report freshness after it finishes, but
  # always execute the platform matrix regardless of the result.
  check-platform-build-freshness:
    name: Check freshness before platform builds
    needs: qemu-runtime
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.freshness.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Report freshness before platform builds
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          build_current="$(bash scripts/check-build-freshness.sh "$GITHUB_SHA")"
          echo "build=$build_current" >> "$GITHUB_OUTPUT"
          if [ "$build_current" != "true" ]; then
            echo "A newer build-relevant commit exists; the platform matrix will still execute."
          fi

  build:
    needs: [qemu-runtime, check-platform-build-freshness]
    # Execute the platform matrix even when an upstream job fails; report failures explicitly.
    if: ${{ always() }}
    name: Build ${{ matrix.platform }} (${{ matrix.channel }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, visionOS]
        channel: ${{ fromJSON(format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.channel == 'Main' && 'main' || 'nightly')) }}
    env:
      RELEASE_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select and verify Xcode 27.1+
        shell: bash
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR="$(xcode-select -p)"
          if [ ! -d "$XCODE_DEVELOPER_DIR" ]; then
            echo "The xcode-27 runner has no active Xcode developer directory." >&2
            exit 1
          fi
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          if ! awk -v version="$XCODE_VERSION" 'BEGIN { split(version, p, "[.]"); major = p[1] + 0; minor = p[2] + 0; exit !(major > 27 || (major == 27 && minor >= 1)) }'; then
            echo "Expected Xcode 27.1 or later on the xcode-27 runner, found $XCODE_VERSION." >&2
            exit 1
          fi
          echo "Using Xcode $XCODE_VERSION at $XCODE_DEVELOPER_DIR"
          xcodebuild -version
      - name: Download required iOS QEMU runtime artifact from this run
        if: matrix.platform == 'iOS'
        uses: actions/download-artifact@v8
        with:
          name: AkatsubakiEmu-qemu-runtime-ios-arm64
          path: build/qemu-runtime

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-xcodegen-${{ runner.os }}-v1

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Prepare Icon Composer app icons
        run: bash scripts/prepare-app-icons.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build and package iOS IPA
        if: matrix.platform == 'iOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            SCHEME="iSteam"
            EXPECTED_BUNDLE="com.xthrx.isteam"
            EXPECTED_PRIMARY_ICON="AkatsubakiDefault"
          else
            SCHEME="iSteamNightly"
            EXPECTED_BUNDLE="com.xthrx.isteam.nightly"
            EXPECTED_PRIMARY_ICON="AkatsubakiSimple"
          fi
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          xcodebuild -project iSteam.xcodeproj -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/iSteam.xcarchive" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 archive
          APP="build/iSteam.xcarchive/Products/Applications/iSteam.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx "$EXPECTED_BUNDLE"
          /usr/libexec/PlistBuddy -c "Print :AkatsubakiPrimaryIconName" "$APP/Info.plist" | grep -Fx "$EXPECTED_PRIMARY_ICON"
          python3 - "$APP/Info.plist" "$EXPECTED_PRIMARY_ICON" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          icon_dictionaries = [
              info.get("CFBundleIcons", {}),
              info.get("CFBundleIcons~ipad", {}),
          ]
          primary_names = {
              item.get("CFBundlePrimaryIcon", {}).get("CFBundleIconName")
              for item in icon_dictionaries
              if isinstance(item, dict)
          }
          alternate_names = set()
          for item in icon_dictionaries:
              if isinstance(item, dict):
                  alternate_names.update(item.get("CFBundleAlternateIcons", {}).keys())
          expected_primary = sys.argv[2]
          required_alternates = {
              "AkatsubakiDefault",
              "AkatsubakiHaloPetals",
              "AkatsubakiPetals",
              "AkatsubakiSimple",
          } - {expected_primary}
          if expected_primary not in primary_names:
              raise SystemExit(f"Primary app icon {expected_primary} is missing: {primary_names}")
          if not required_alternates.issubset(alternate_names):
              raise SystemExit(f"Alternate app icons are missing: {required_alternates - alternate_names}")
          print(f"Verified primary {expected_primary} and alternate icons: {sorted(alternate_names)}")
          PY
          RUNTIME_DIR="build/qemu-runtime"
          test -d "$RUNTIME_DIR/Frameworks" || { echo "Required QEMU Frameworks directory is missing." >&2; exit 1; }
          test -d "$RUNTIME_DIR/QEMU/JIT" || { echo "Required QEMU JIT data directory is missing." >&2; exit 1; }
          test -d "$RUNTIME_DIR/QEMU/TCI" || { echo "Required QEMU TCI data directory is missing." >&2; exit 1; }

          # The merger stores each runtime manifest beside that mode's data.
          # Validate both modes and their libraries before embedding either one.
          for MODE in JIT TCI; do
            MODE_DIR="$RUNTIME_DIR/QEMU/$MODE"
            MODE_MANIFEST="$MODE_DIR/runtime-library-path.txt"
            MODE_EXPORTS="$MODE_DIR/exports.txt"
            test -s "$MODE_MANIFEST" || { echo "QEMU $MODE runtime library manifest is missing." >&2; exit 1; }
            test -s "$MODE_EXPORTS" || { echo "QEMU $MODE export manifest is missing." >&2; exit 1; }
            test "$(awk 'END { print NR }' "$MODE_MANIFEST")" -eq 1 || { echo "QEMU $MODE runtime manifest must contain exactly one path." >&2; exit 1; }
            RUNTIME_REL="$(head -n 1 "$MODE_MANIFEST")"
            case "$RUNTIME_REL" in
              Frameworks/*) ;;
              *) echo "Unexpected QEMU $MODE runtime path: $RUNTIME_REL" >&2; exit 1 ;;
            esac
            if printf '%s\n' "$RUNTIME_REL" | grep -Eq '(^|/)\.\.?(/|$)|//|\\'; then
              echo "Unsafe QEMU $MODE runtime path: $RUNTIME_REL" >&2
              exit 1
            fi
            test -s "$RUNTIME_DIR/$RUNTIME_REL" || { echo "QEMU $MODE manifest points to a missing library: $RUNTIME_REL" >&2; exit 1; }
            grep -Eq ' _?qemu_init$' "$MODE_EXPORTS" || { echo "QEMU $MODE init export is missing." >&2; exit 1; }
            grep -Eq ' _?qemu_main_loop$' "$MODE_EXPORTS" || { echo "QEMU $MODE main-loop export is missing." >&2; exit 1; }
            grep -Eq ' _?qemu_cleanup$' "$MODE_EXPORTS" || { echo "QEMU $MODE cleanup export is missing." >&2; exit 1; }
            grep -Eq ' _?qemu_system_shutdown_request$' "$MODE_EXPORTS" || { echo "QEMU $MODE graceful-shutdown export is missing." >&2; exit 1; }
            if [ "$MODE" = "JIT" ]; then
              grep -Eq ' _?isteam_qemu_set_jit_callbacks$' "$MODE_EXPORTS" || { echo "QEMU StikDebug JIT callback export is missing." >&2; exit 1; }
            elif grep -Eq ' _?isteam_qemu_set_jit_callbacks$' "$MODE_EXPORTS"; then
              echo "QEMU TCI runtime must not export the StikDebug JIT callback." >&2
              exit 1
            fi
          done

          # Embed both modes and verify the exact paths used by the app.
          mkdir -p "$APP/Frameworks" "$APP/QEMU"
          cp -R "$RUNTIME_DIR/Frameworks/." "$APP/Frameworks/"
          cp -R "$RUNTIME_DIR/QEMU/." "$APP/QEMU/"
          for MODE in JIT TCI; do
            MODE_DIR="$APP/QEMU/$MODE"
            test -s "$MODE_DIR/runtime-library-path.txt" || { echo "Embedded QEMU $MODE manifest is missing." >&2; exit 1; }
            test -s "$MODE_DIR/exports.txt" || { echo "Embedded QEMU $MODE exports are missing." >&2; exit 1; }
            RUNTIME_REL="$(head -n 1 "$MODE_DIR/runtime-library-path.txt")"
            test -s "$APP/$RUNTIME_REL" || { echo "Embedded QEMU $MODE library is missing: $RUNTIME_REL" >&2; exit 1; }
            MODE_LOWER="$(printf '%s' "$MODE" | tr '[:upper:]' '[:lower:]')"
            bash scripts/validate-qemu-runtime.sh "$APP/$RUNTIME_REL" "$MODE_LOWER"
            test -n "$(find "$MODE_DIR" -type f ! -name runtime-library-path.txt ! -name exports.txt -size +0c -print -quit)" || { echo "No QEMU $MODE data files were embedded." >&2; exit 1; }
          done

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/iSteam.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/iSteam-ios.ipa
          unzip -t build/iSteam-ios.ipa >/dev/null
          bash scripts/validate-apple-package.sh build/iSteam-ios.ipa iSteam.app "$EXPECTED_BUNDLE"
          shasum -a 256 build/iSteam-ios.ipa > build/iSteam-ios.ipa.sha256
      - name: Build and package tvOS IPA
        if: matrix.platform == 'tvOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            EXPECTED_BUNDLE="com.xthrx.isteam.tvos"
          else
            EXPECTED_BUNDLE="com.xthrx.isteam.tvos.nightly"
          fi
          xcodebuild -project iSteam.xcodeproj -scheme iSteamTV -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath "$PWD/build/tvDerivedData" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" PRODUCT_BUNDLE_IDENTIFIER="$EXPECTED_BUNDLE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 build
          APP="build/tvDerivedData/Build/Products/Release-appletvos/iSteamTV.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx "$EXPECTED_BUNDLE"
          mkdir -p build/tvPayload/Payload
          cp -R "$APP" build/tvPayload/Payload/iSteamTV.app
          ditto -c -k --sequesterRsrc --keepParent build/tvPayload/Payload build/iSteam-tvOS.ipa
          unzip -t build/iSteam-tvOS.ipa >/dev/null
          bash scripts/validate-apple-package.sh build/iSteam-tvOS.ipa iSteamTV.app "$EXPECTED_BUNDLE"
          shasum -a 256 build/iSteam-tvOS.ipa > build/iSteam-tvOS.ipa.sha256

      - name: Build and package visionOS app
        if: matrix.platform == 'visionOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            EXPECTED_BUNDLE="com.xthrx.isteam.visionos"
          else
            EXPECTED_BUNDLE="com.xthrx.isteam.visionos.nightly"
          fi
          xcodebuild -project iSteam.xcodeproj -scheme iSteamVision -configuration Release -sdk xros -destination 'generic/platform=visionOS' -derivedDataPath "$PWD/build/visionDerivedData" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" PRODUCT_BUNDLE_IDENTIFIER="$EXPECTED_BUNDLE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 build
          APP="build/visionDerivedData/Build/Products/Release-xros/iSteamVision.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx "$EXPECTED_BUNDLE"
          mkdir -p build/visionPayload/Payload
          cp -R "$APP" build/visionPayload/Payload/iSteamVision.app
          ditto -c -k --sequesterRsrc --keepParent build/visionPayload/Payload build/iSteam-visionOS.ipa
          unzip -t build/iSteam-visionOS.ipa >/dev/null
          bash scripts/validate-apple-package.sh build/iSteam-visionOS.ipa iSteamVision.app "$EXPECTED_BUNDLE"
          shasum -a 256 build/iSteam-visionOS.ipa > build/iSteam-visionOS.ipa.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AkatsubakiEmu-${{ matrix.platform }}-${{ matrix.channel }}
          path: |
            build/iSteam-${{ matrix.platform == 'iOS' && 'ios' || matrix.platform == 'tvOS' && 'tvOS' || 'visionOS' }}.ipa
            build/iSteam-${{ matrix.platform == 'iOS' && 'ios' || matrix.platform == 'tvOS' && 'tvOS' || 'visionOS' }}.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish combined ${{ matrix.channel }} release
    permissions:
      contents: write
    needs: [validate-release-channel, check-push-freshness, qemu-runtime, check-platform-build-freshness, build]
    # Run the publisher job on every workflow invocation, but fail closed before publishing.
    if: ${{ always() }}
    concurrency:
      # Keep QEMU and platform builds parallel; serialize only updates to a shared release tag.
      group: isteam-release-publish-${{ matrix.channel }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(format('["{0}"]', github.event_name == 'workflow_dispatch' && inputs.channel == 'Main' && 'main' || 'nightly')) }}
    env:
      RELEASE_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require successful build prerequisites and QEMU GPL compatibility approval
        env:
          CHANNEL_VALIDATION_RESULT: ${{ needs.validate-release-channel.result }}
          PUSH_FRESHNESS_RESULT: ${{ needs.check-push-freshness.result }}
          QEMU_RUNTIME_RESULT: ${{ needs.qemu-runtime.result }}
          PLATFORM_CHECK_RESULT: ${{ needs.check-platform-build-freshness.result }}
          PLATFORM_BUILD_RESULT: ${{ needs.build.result }}
          QEMU_GPL_APPROVED: ${{ vars.QEMU_GPL_COMPATIBILITY_REVIEW_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$CHANNEL_VALIDATION_RESULT" "$PUSH_FRESHNESS_RESULT" "$QEMU_RUNTIME_RESULT" "$PLATFORM_CHECK_RESULT" "$PLATFORM_BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required build prerequisite did not succeed (result: $result)." >&2
              exit 1
            fi
          done
          if [ "$QEMU_GPL_APPROVED" != "true" ]; then
            echo "::error::QEMU GPL compatibility review is not approved; refusing to publish combined binaries." >&2
            exit 1
          fi

      - name: Check that this run still targets the latest main commit
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          publish_current="$(bash scripts/check-build-freshness.sh "$GITHUB_SHA")"
          echo "publish=$publish_current" >> "$GITHUB_OUTPUT"
          if [ "$publish_current" != "true" ]; then
            echo "::error::This run is stale; refusing to report a successful no-op release." >&2
            exit 1
          fi

      - name: Download iOS build
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: AkatsubakiEmu-iOS-${{ matrix.channel }}
          path: build

      - name: Download tvOS build
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: AkatsubakiEmu-tvOS-${{ matrix.channel }}
          path: build

      - name: Download visionOS build
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: AkatsubakiEmu-visionOS-${{ matrix.channel }}
          path: build

      - name: Verify combined release assets
        if: steps.freshness.outputs.publish == 'true'
        run: |
          set -euo pipefail
          for asset in iSteam-ios iSteam-tvOS iSteam-visionOS; do
            test -s "build/$asset.ipa"
            test -s "build/$asset.ipa.sha256"
            unzip -t "build/$asset.ipa" >/dev/null
            sha256sum -c "build/$asset.ipa.sha256"
          done

      # Downloads and checksum verification can take time. Recheck immediately
      # before mutating the rolling release so a newer main commit wins.
      - name: Re-check freshness immediately before publishing
        if: steps.freshness.outputs.publish == 'true'
        id: final-freshness
        shell: bash
        run: |
          set -euo pipefail
          publish_current="$(bash scripts/check-build-freshness.sh "$GITHUB_SHA")"
          echo "publish=$publish_current" >> "$GITHUB_OUTPUT"
          if [ "$publish_current" != "true" ]; then
            echo "::error::The source became stale before publishing; refusing to report success." >&2
            exit 1
          fi

      - name: Set release metadata
        if: steps.final-freshness.outputs.publish == 'true'
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.$(printf '%03d' "$GITHUB_RUN_NUMBER")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_CHANNEL" = "main" ]; then
            echo "title=$VERSION Main (iOS + tvOS + visionOS)" >> "$GITHUB_OUTPUT"
          else
            echo "title=$VERSION Nightly (iOS + tvOS + visionOS)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish combined release
        if: steps.final-freshness.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ env.RELEASE_CHANNEL == 'nightly' }}
          make_latest: ${{ env.RELEASE_CHANNEL == 'main' && 'true' || 'false' }}
          overwrite_files: true
          files: |
            build/iSteam-ios.ipa
            build/iSteam-ios.ipa.sha256
            build/iSteam-tvOS.ipa
            build/iSteam-tvOS.ipa.sha256
            build/iSteam-visionOS.ipa
            build/iSteam-visionOS.ipa.sha256
          body: |
            Akatsubaki Emu ${{ matrix.channel }} build ${{ steps.meta.outputs.version }}.

            Includes unsigned prototype builds:
            - **iOS:** `iSteam-ios.ipa`
            - **tvOS:** `iSteam-tvOS.ipa`
            - **visionOS:** `iSteam-visionOS.ipa`

            These are unsigned prototype builds. Sign them with a compatible signer before installing.

            Source commit: ${{ github.sha }}

      # Keep main/nightly channel tags immutable; release assets update in place.
      # Record the exact source commit rather than force-pushing a tag reference.
      # Official AltStore/PAL feeds are refreshed from published GitHub releases
      # by the website repository's update-xthrx-alt-source.yml workflow.

  # Never let GitHub report a green release run when any job was skipped.
  enforce-no-skipped-jobs:
    name: Require every workflow job to complete
    if: always()
    needs:
      - validate-release-channel
      - check-push-freshness
      - qemu-runtime
      - check-platform-build-freshness
      - build
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job was skipped or did not succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          non_success = {
              name: job.get("result", "missing")
              for name, job in jobs.items()
              if job.get("result") != "success"
          }
          if non_success:
              for name, result in sorted(non_success.items()):
                  print(
                      f"ERROR: required workflow job '{name}' finished with '{result}'.",
                      file=sys.stderr,
                  )
              print(
                  "The workflow cannot report success unless every required job succeeds and none are skipped.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(
              f"Verified {len(jobs)} required jobs: all succeeded; no jobs were skipped."
          )
          PY
