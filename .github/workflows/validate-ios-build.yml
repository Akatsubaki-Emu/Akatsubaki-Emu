name: Akatsubaki Emu platform compile validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-ios-build.yml
      - src/**
      - iSteam/**
      - project.yml
      - scripts/tests/**
      - scripts/validate-qemu-source.py
      - scripts/check-validation-freshness.sh
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false


jobs:
  check-validation-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.freshness.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check whether this validation run is still current
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          current="$(bash scripts/check-validation-freshness.sh "$GITHUB_SHA")"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Validation freshness: $current"

  build-platform-simulators:
    needs: check-validation-freshness
    if: needs.check-validation-freshness.outputs.current == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: iSteam
            sdk: iphonesimulator
            destination: generic/platform=iOS Simulator
          - scheme: iSteamTV
            sdk: appletvsimulator
            destination: generic/platform=tvOS Simulator
          - scheme: iSteamVision
            sdk: xrsimulator
            destination: generic/platform=visionOS Simulator
    steps:
      - uses: actions/checkout@v7
      - name: Select and verify Xcode 27.1+
        shell: bash
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR="$(xcode-select -p)"
          if [ ! -d "$XCODE_DEVELOPER_DIR" ]; then
            echo "The xcode-27 runner has no active Xcode developer directory." >&2
            exit 1
          fi
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          if ! awk -v version="$XCODE_VERSION" 'BEGIN { split(version, p, "[.]"); major = p[1] + 0; minor = p[2] + 0; exit !(major > 27 || (major == 27 && minor >= 1)) }'; then
            echo "Expected Xcode 27.1 or later on the xcode-27 runner, found $XCODE_VERSION." >&2
            exit 1
          fi
          echo "Using Xcode $XCODE_VERSION at $XCODE_DEVELOPER_DIR"
          xcodebuild -version
      - name: Test translation cache integrity and invalidation
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Core/EmulationLog.swift \
            src/Performance/TranslationCache.swift \
            scripts/tests/test_translation_cache.swift \
            -o "$RUNNER_TEMP/test-translation-cache"
          "$RUNNER_TEMP/test-translation-cache"
      - name: Test emulation log guest-output notifications
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 src/Core/EmulationLog.swift scripts/tests/test_emulation_log_observer.swift -o "$RUNNER_TEMP/test-emulation-log-observer"
          "$RUNNER_TEMP/test-emulation-log-observer"
      - name: Test Kenran Buto x86-64 to ARM64 AOT translation
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/X86_64AOTTranslator.swift \
            scripts/tests/test_kenran_buto_aot_translator.swift \
            -o "$RUNNER_TEMP/test-kenran-buto-aot"
          "$RUNNER_TEMP/test-kenran-buto-aot"
      - name: Test Kenran Buto AOT artifact cache and ABI isolation
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Core/EmulationLog.swift \
            src/Performance/TranslationCache.swift \
            src/Runtime/X86_64AOTTranslator.swift \
            src/Runtime/KenranButoAOTCompiler.swift \
            scripts/tests/test_kenran_buto_aot_cache.swift \
            -o "$RUNNER_TEMP/test-kenran-buto-aot-cache"
          "$RUNNER_TEMP/test-kenran-buto-aot-cache"
      - name: Test ELF program-header table mapping
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 src/Runtime/ELF64Loader.swift scripts/tests/test_elf_loader_program_headers.swift -o "$RUNNER_TEMP/test-elf-phdr"
          "$RUNNER_TEMP/test-elf-phdr"

      - name: Test static ELF load, process entry and syscall execution
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/ELF64Loader.swift \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/LinuxProcessStackBuilder.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/X86_64Interpreter.swift \
            scripts/tests/test_static_elf_execution.swift \
            -o "$RUNNER_TEMP/test-static-elf"
          "$RUNNER_TEMP/test-static-elf"
      - name: Test Linux x86-64 syscall memory model
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/LinuxSyscallDispatcher.swift \
            scripts/tests/test_linux_syscall_dispatcher.swift \
            -o "$RUNNER_TEMP/test-linux-syscalls"
          "$RUNNER_TEMP/test-linux-syscalls"
      - name: Test Linux x86-64 process stack and auxiliary vector
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/LinuxProcessStackBuilder.swift \
            scripts/tests/test_linux_process_stack.swift \
            -o "$RUNNER_TEMP/test-linux-process-stack"
          "$RUNNER_TEMP/test-linux-process-stack"
      - name: Test hybrid runtime backend routing
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/ExecutionBackendRouter.swift \
            scripts/tests/test_execution_backend_router.swift \
            -o "$RUNNER_TEMP/test-backend-router"
          "$RUNNER_TEMP/test-backend-router"
      - name: Test x86-64 interpreter ALU, memory, stack and syscall path
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/X86_64Interpreter.swift \
            scripts/tests/test_x86_64_interpreter.swift \
            -o "$RUNNER_TEMP/test-x86-64-interpreter"
          "$RUNNER_TEMP/test-x86-64-interpreter"
      - name: Test LocalDevVPN callback status handling
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            iSteam/LocalDevVPNCallback.swift \
            scripts/tests/test_localdevvpn_callback.swift \
            -o "$RUNNER_TEMP/localdevvpn-callback-tests"
          "$RUNNER_TEMP/localdevvpn-callback-tests"

      - name: Test game library filtering, ordering, and tag collection
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Steam/GameLibraryQuery.swift \
            scripts/tests/test_game_library_query.swift \
            -o "$RUNNER_TEMP/test-game-library-query"
          "$RUNNER_TEMP/test-game-library-query"

      - name: Test bounded Windows PE import directory parsing
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/GuestProcess.swift \
            src/Runtime/WindowsPEImage.swift \
            scripts/tests/test_windows_pe_image.swift \
            -o "$RUNNER_TEMP/test-windows-pe-image"
          "$RUNNER_TEMP/test-windows-pe-image"

      - name: Test VNC key-state source arbitration
        if: matrix.scheme == 'iSteam'
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/QEMU/VNCKeyState.swift \
            scripts/tests/test_vnc_key_state.swift \
            -o "$RUNNER_TEMP/test-vnc-key-state"
          "$RUNNER_TEMP/test-vnc-key-state"
      - name: Validate runtime bridge and packaging contracts
        if: matrix.scheme == 'iSteam'
        run: python3 scripts/validate-qemu-source.py
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Prepare Icon Composer app icons
        run: bash scripts/prepare-app-icons.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile ${{ matrix.scheme }} for ${{ matrix.destination }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project iSteam.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -sdk "${{ matrix.sdk }}" \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            build


  build-ios-device:
    needs: check-validation-freshness
    if: needs.check-validation-freshness.outputs.current == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select and verify Xcode 27.1+
        shell: bash
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR="$(xcode-select -p)"
          if [ ! -d "$XCODE_DEVELOPER_DIR" ]; then
            echo "The xcode-27 runner has no active Xcode developer directory." >&2
            exit 1
          fi
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          if ! awk -v version="$XCODE_VERSION" 'BEGIN { split(version, p, "[.]"); major = p[1] + 0; minor = p[2] + 0; exit !(major > 27 || (major == 27 && minor >= 1)) }'; then
            echo "Expected Xcode 27.1 or later on the xcode-27 runner, found $XCODE_VERSION." >&2
            exit 1
          fi
          echo "Using Xcode $XCODE_VERSION at $XCODE_DEVELOPER_DIR"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Prepare Icon Composer app icons
        run: bash scripts/prepare-app-icons.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Compile physical iOS ARM64 target without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project iSteam.xcodeproj \
            -scheme iSteam \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-iOS-device" \
            CODE_SIGNING_ALLOWED=NO \
            build
