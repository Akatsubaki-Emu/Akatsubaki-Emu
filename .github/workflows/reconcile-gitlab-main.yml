name: Reconcile GitLab mirror history

on:
  workflow_dispatch:
    inputs:
      authorize_gitlab_main_merge:
        description: "Explicit owner authorization to merge the exact reviewed GitLab main history into canonical GitHub main."
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-gitlab-main.yml

permissions:
  contents: write

concurrency:
  group: reconcile-gitlab-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'xthrx-chu' && inputs.authorize_gitlab_main_merge == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch GitLab mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::Missing GITLAB_TOKEN with read_repository permission."
            exit 1
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/chantinlongxthrx/I-steam.git"
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags gitlab main; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Unable to fetch GitLab main after five attempts."
          exit 1

      - name: Merge mirror history without rewriting
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor refs/remotes/gitlab/main HEAD; then
            echo "GitLab main is already included in canonical main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff --no-edit refs/remotes/gitlab/main
          git push origin HEAD:main
