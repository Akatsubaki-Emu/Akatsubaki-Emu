name: Update Repository Metrics

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Akatsubaki-Emu Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Akatsubaki-Emu
          repo: Akatsubaki-Emu
          template: repository
          filename: docs/metrics.svg
          config_display: columns
          config_timezone: UTC
          base: header, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30
          plugin_contributors: yes
          plugin_contributors_sections: contributions
          plugin_contributors_categories: yes
          plugin_contributors_limit: 6
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
