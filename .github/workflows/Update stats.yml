name: Update Repository Metrics

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/metrics.svg"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Generate Akatsubaki-Emu Metrics
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Akatsubaki-Emu
          repo: Akatsubaki-Emu
          template: repository
          filename: docs/metrics.svg
          config_display: columns
          config_timezone: UTC
          config_order: base.header, base.metadata, followup, lines, contributors, languages
          base: header, metadata
          base_indepth: no
          base_hireable: no
          base_skip: deployments, environments
          plugin_followup: yes
          plugin_followup_sections: repository
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_delay: 60
          plugin_contributors: yes
          plugin_contributors_base: main
          plugin_contributors_sections: contributions
          plugin_contributors_categories: yes
          plugin_contributors_limit: 6
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 5
          committer_message: "chore: update metrics [skip ci]"
