name: Generate Repository Metrics Artifacts

concurrency:
  group: update-repository-metrics-${{ github.ref }}
  cancel-in-progress: false

# Metrics are generated as downloadable artifacts only. GitLab main is the
# project write target; do not create GitHub-only commits from this workflow.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    name: Cancel superseded metrics runs
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older metrics runs for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/Update stats.yml" and .head_branch == "main" and .status != "completed") | .id' |
          while IFS= read -r run_id; do
            if [ "$run_id" -ge "$GITHUB_RUN_ID" ]; then
              continue
            fi
            echo "Canceling superseded metrics run $run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

  overview:
    needs: cancel-stale
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Generate Left Card (Overview & PR/Issue Follow-up)
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Akatsubaki-Emu
          repo: Akatsubaki-Emu
          template: repository
          filename: docs/metrics-overview.svg
          output_action: none
          config_timezone: UTC
          base: header, metadata
          plugin_followup: yes
          plugin_followup_sections: repository
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_delay: 60
      - name: Upload overview metrics SVG
        uses: actions/upload-artifact@v4
        with:
          name: repository-metrics-overview
          path: /metrics_renders/docs/metrics-overview.svg
          if-no-files-found: error
          retention-days: 30

  team:
    needs: cancel-stale
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Generate Right Card (Contributors & Languages)
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Akatsubaki-Emu
          repo: Akatsubaki-Emu
          template: repository
          filename: docs/metrics-team.svg
          output_action: none
          config_timezone: UTC
          base: metadata
          plugin_contributors: yes
          plugin_contributors_base: main
          plugin_contributors_sections: contributions
          plugin_contributors_categories: yes
          plugin_contributors_limit: 6
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
      - name: Upload team metrics SVG
        uses: actions/upload-artifact@v4
        with:
          name: repository-metrics-team
          path: /metrics_renders/docs/metrics-team.svg
          if-no-files-found: error
          retention-days: 30

