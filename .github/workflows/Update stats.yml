name: Update Repository Metrics

concurrency:
  group: update-repository-metrics-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/*.svg"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Generate Left Card (Overview & PR/Issue Follow-up)
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Akatsubaki-Emu
          repo: Akatsubaki-Emu
          template: repository
          filename: docs/metrics-overview.svg
          config_timezone: UTC
          base: header, metadata
          plugin_followup: yes
          plugin_followup_sections: repository
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_delay: 60
          committer_message: "chore: update metrics overview [skip ci]"

  team:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Generate Right Card (Contributors & Languages)
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Akatsubaki-Emu
          repo: Akatsubaki-Emu
          template: repository
          filename: docs/metrics-team.svg
          config_timezone: UTC
          base: metadata
          plugin_contributors: yes
          plugin_contributors_base: main
          plugin_contributors_sections: contributions
          plugin_contributors_categories: yes
          plugin_contributors_limit: 6
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          committer_message: "chore: update metrics team [skip ci]"

  sync-mirror:
    name: Sync metrics commits to GitLab
    runs-on: ubuntu-latest
    needs: [overview, team]
    permissions:
      actions: write
      contents: read
    steps:
      # Commits made with GITHUB_TOKEN do not trigger push workflows.
      # Dispatch the retained sync workflow after both metrics commits finish.
      - name: Dispatch GitHub-to-GitLab synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run blank.yml --repo "${GITHUB_REPOSITORY}" --ref main
