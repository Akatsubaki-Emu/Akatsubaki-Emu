name: Update Repository Metrics

on:
  schedule:
    # Runs daily at 03:00 UTC (offset from your 02:00 UTC release build)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Akatsubaki-Emu Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Akatsubaki-Emu
          repo: Akatsubaki-Emu
          template: repository
          filename: docs/metrics.svg
          base: header, activity, community, repositories
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_contributors: yes
          plugin_contributors_sections: contributions
          plugin_activity: yes
          plugin_activity_limit: 5
          config_timezone: UTC
