name: GitHub to GitLab Push Sync

# Every commit pushed to GitHub main is propagated to GitLab main.
# The reverse mirror remains safe: this job exits when both refs already match.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-to-gitlab-main
  cancel-in-progress: false

jobs:
  sync:
    name: Push GitHub main to GitLab main
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out GitHub main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push commit history to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::Missing GITLAB_TOKEN. Add a GitLab project access token with write_repository permission to chantinlongxthrx/I-steam → Settings → Secrets and variables → Actions."
            exit 1
          fi

          git config user.name "Akatsubaki Emu GitHub Sync"
          git config user.email "i-steam-sync[bot]@users.noreply.github.com"
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/chantinlongxthrx/I-steam.git"
          git fetch --no-tags gitlab main

          GITHUB_SHA="$(git rev-parse HEAD)"
          GITLAB_SHA="$(git rev-parse gitlab/main)"
          echo "GitHub main: ${GITHUB_SHA}"
          echo "GitLab main: ${GITLAB_SHA}"

          if [ "${GITHUB_SHA}" = "${GITLAB_SHA}" ]; then
            echo "GitLab already contains this exact commit."
            exit 0
          fi

          if git merge-base --is-ancestor "${GITLAB_SHA}" "${GITHUB_SHA}"; then
            echo "GitHub is ahead; pushing the fast-forward update."
            push_log="$(mktemp)"
            trap 'rm -f "$push_log"' EXIT
            for attempt in 1 2 3 4 5; do
              : > "$push_log"
              if git push gitlab HEAD:refs/heads/main 2>&1 | tee "$push_log"; then
                echo "GitLab main is now synchronized."
                exit 0
              fi

              if ! grep -Eiq '429|rate limit exceeded|too many requests' "$push_log"; then
                echo "::error::GitLab push failed for a reason other than a rate limit."
                exit 1
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "::error::GitLab remained rate-limited after five attempts."
                exit 1
              fi

              case "$attempt" in
                1) delay=60 ;;
                2) delay=120 ;;
                3) delay=240 ;;
                *) delay=300 ;;
              esac
              echo "::warning::GitLab rate limit encountered; retrying in ${delay}s (attempt $((attempt + 1))/5)."
              sleep "$delay"

              if ! git fetch --no-tags gitlab main; then
                echo "::error::Could not refresh GitLab main before retry; refusing to push without checking ancestry."
                exit 1
              fi
              GITLAB_SHA="$(git rev-parse gitlab/main)"
              if [ "${GITHUB_SHA}" = "${GITLAB_SHA}" ]; then
                echo "GitLab already contains this exact commit."
                exit 0
              fi
              if ! git merge-base --is-ancestor "${GITLAB_SHA}" "${GITHUB_SHA}"; then
                echo "::error::GitLab main moved or diverged during retry; refusing to overwrite newer history."
                exit 1
              fi
            done
            exit 1
          fi

          if git merge-base --is-ancestor "${GITHUB_SHA}" "${GITLAB_SHA}"; then
            echo "::error::GitLab main is ahead of this GitHub commit. Refusing to overwrite newer GitLab history; reconcile the branches first."
            exit 1
          fi

          echo "::error::GitHub and GitLab main have diverged. Refusing to auto-merge because conflict resolution could discard work on either remote. Reconcile the histories manually."
          exit 1
