name: Kenran Butō AOT validation

on:
  push:
    branches: [main]
    paths:
      - "src/Runtime/X86_64AOTTranslator.swift"
      - "src/Core/EmulationLog.swift"
      - "src/Runtime/GuestMemory.swift"
      - "src/Runtime/LinuxSyscallDispatcher.swift"
      - "src/Runtime/X86_64ALU.swift"
      - "iSteam/JIT26Protocol.c"
      - "src/Runtime/KenranButoAOTCompiler.swift"
      - "src/Runtime/KenranButoAOTExecution.swift"
      - "src/Runtime/X86_64Interpreter.swift"
      - "src/Runtime/GuestMachine.swift"
      - "src/Core/VMConfiguration.swift"
      - "src/Core/VMConfigurationValidation.swift"
      - "src/QEMU/QEMUNativeRuntime.swift"
      - "iSteam/JIT26Protocol.h"
      - "iSteam/KenranButoAOTExecutableMemory.c"
      - "scripts/tests/test_x86_64_interpreter.swift"
      - "scripts/tests/test_vm_configuration_validation.swift"
      - "scripts/validate-qemu-source.py"
      - "scripts/tests/test_static_elf_execution.swift"
      - "scripts/build_hybrid_stdin_smoke_elf.py"
      - "scripts/tests/test_hybrid_stdin_smoke_elf.py"
      - "src/Runtime/ELF64Loader.swift"
      - "src/Runtime/LinuxProcessStackBuilder.swift"
      - "src/Runtime/RuntimeCapabilityRegistry.swift"
      - "docs/KENRAN_BUTO_AOT_ABI.md"
      - "src/Performance/TranslationCache.swift"
      - "scripts/tests/test_kenran_buto_aot_*.swift"
      - "scripts/tests/test_aot_translator_allocation_hot_path.py"
      - "scripts/tests/test_aot_workflow_trigger_parity.py"
      - "scripts/tests/test_source_validator.py"
      - "scripts/tests/test_aot_executable_arena.c"
      - "iSteam/AOTExecutableArena.c"
      - "scripts/tests/test_native_guest_machine_smoke.swift"
      - "scripts/tests/NativeGuestMachine-Bridging-Header.h"
      - "scripts/tests/test_native_guest_machine_workflow.py"
      - "scripts/build_hybrid_runtime_smoke_elf.py"
      - "iSteam/NativeGuestMemory.cpp"
      - "iSteam/NativeGuestMemory.h"
      - "src/Runtime/ExecutionBackendRouter.swift"
      - "scripts/tests/test_execution_backend_router.swift"
      - ".github/workflows/build-core-only-ios.yml"
      - ".github/workflows/build-qemu-runtime.yml"
      - ".github/workflows/validate-kenran-buto-aot.yml"
      - "docs/FEXCORE_IOS_PORT_AUDIT.md"
      - "docs/FIRST_PLAYABLE_IOS_ACCEPTANCE.md"
      - "iSteam/JITCoordinator.swift"
      - "scripts/tests/test_ios_jit_memory_contract.py"
      - "scripts/tests/test_jit_protocol.py"
      - "scripts/tests/test_jit_coordinator.py"
  pull_request:
    paths:
      - "src/Runtime/X86_64AOTTranslator.swift"
      - "src/Core/EmulationLog.swift"
      - "src/Runtime/GuestMemory.swift"
      - "src/Runtime/LinuxSyscallDispatcher.swift"
      - "src/Runtime/X86_64ALU.swift"
      - "iSteam/JIT26Protocol.c"
      - "src/Runtime/KenranButoAOTCompiler.swift"
      - "src/Runtime/KenranButoAOTExecution.swift"
      - "src/Runtime/X86_64Interpreter.swift"
      - "src/Runtime/GuestMachine.swift"
      - "src/Core/VMConfiguration.swift"
      - "src/Core/VMConfigurationValidation.swift"
      - "src/QEMU/QEMUNativeRuntime.swift"
      - "iSteam/JIT26Protocol.h"
      - "iSteam/KenranButoAOTExecutableMemory.c"
      - "scripts/tests/test_x86_64_interpreter.swift"
      - "scripts/tests/test_vm_configuration_validation.swift"
      - "scripts/validate-qemu-source.py"
      - "scripts/tests/test_static_elf_execution.swift"
      - "scripts/build_hybrid_stdin_smoke_elf.py"
      - "scripts/tests/test_hybrid_stdin_smoke_elf.py"
      - "src/Runtime/ELF64Loader.swift"
      - "src/Runtime/LinuxProcessStackBuilder.swift"
      - "src/Runtime/RuntimeCapabilityRegistry.swift"
      - "docs/KENRAN_BUTO_AOT_ABI.md"
      - "src/Performance/TranslationCache.swift"
      - "scripts/tests/test_kenran_buto_aot_*.swift"
      - "scripts/tests/test_aot_translator_allocation_hot_path.py"
      - "scripts/tests/test_aot_workflow_trigger_parity.py"
      - "scripts/tests/test_source_validator.py"
      - "scripts/tests/test_aot_executable_arena.c"
      - "iSteam/AOTExecutableArena.c"
      - "scripts/tests/test_native_guest_machine_smoke.swift"
      - "scripts/tests/NativeGuestMachine-Bridging-Header.h"
      - "scripts/tests/test_native_guest_machine_workflow.py"
      - "scripts/build_hybrid_runtime_smoke_elf.py"
      - "iSteam/NativeGuestMemory.cpp"
      - "iSteam/NativeGuestMemory.h"
      - "src/Runtime/ExecutionBackendRouter.swift"
      - "scripts/tests/test_execution_backend_router.swift"
      - ".github/workflows/build-core-only-ios.yml"
      - ".github/workflows/build-qemu-runtime.yml"
      - ".github/workflows/validate-kenran-buto-aot.yml"
      - "docs/FEXCORE_IOS_PORT_AUDIT.md"
      - "docs/FIRST_PLAYABLE_IOS_ACCEPTANCE.md"
      - "iSteam/JITCoordinator.swift"
      - "scripts/tests/test_ios_jit_memory_contract.py"
      - "scripts/tests/test_jit_protocol.py"
      - "scripts/tests/test_jit_coordinator.py"
  workflow_dispatch:

concurrency:
  group: kenran-buto-aot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  translator:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.{yml,yaml}").sort.each { |path| YAML.load_file(path, aliases: true); puts "Validated #{path}" }'
      - name: Compile TXM/SPTM iOS arm64 JIT sources
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$SDK" -std=c11 -Wall -Wextra -I iSteam -c iSteam/JIT26Protocol.c -o "$RUNNER_TEMP/jit26-protocol.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$SDK" -std=c11 -Wall -Wextra -I iSteam -c iSteam/AOTExecutableArena.c -o "$RUNNER_TEMP/aot-executable-arena-ios.o"
          xcrun --sdk iphoneos clang -target arm64-apple-ios26.0 -isysroot "$SDK" -std=c11 -Wall -Wextra -I iSteam -c iSteam/KenranButoAOTExecutableMemory.c -o "$RUNNER_TEMP/aot-executable-memory-ios.o"
      - name: Verify fixed-buffer translator allocation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_aot_translator_allocation_hot_path.py'
      - name: Validate device-aware guest RAM budget
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Core/VMConfiguration.swift \
            src/Core/VMConfigurationValidation.swift \
            scripts/tests/test_vm_configuration_validation.swift \
            -o "$RUNNER_TEMP/test-vm-configuration-validation"
          "$RUNNER_TEMP/test-vm-configuration-validation"
      - name: Run TXM executable arena allocator tests
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -pthread -I iSteam \
            iSteam/AOTExecutableArena.c scripts/tests/test_aot_executable_arena.c \
            -o "$RUNNER_TEMP/test-aot-executable-arena"
          "$RUNNER_TEMP/test-aot-executable-arena"
      - name: Validate backend routing and anti-cheat policy
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/ExecutionBackendRouter.swift \
            scripts/tests/test_execution_backend_router.swift \
            -o "$RUNNER_TEMP/test-execution-backend-router"
          "$RUNNER_TEMP/test-execution-backend-router"
      - name: Run repository source-contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_source_validator.py'
          python3 -m unittest discover -s scripts/tests -p 'test_ios_jit_memory_contract.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_jit_protocol.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_jit_coordinator.py' -v
      - name: Compile and test x86-64 to AArch64 decoder
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/X86_64AOTTranslator.swift \
            scripts/tests/test_kenran_buto_aot_translator.swift \
            -o "$RUNNER_TEMP/test-kenran-buto-aot-translator"
          "$RUNNER_TEMP/test-kenran-buto-aot-translator"
      - name: Compile and test translation-cache integration
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Core/EmulationLog.swift \
            src/Performance/TranslationCache.swift \
            src/Runtime/X86_64AOTTranslator.swift \
            src/Runtime/KenranButoAOTCompiler.swift \
            scripts/tests/test_kenran_buto_aot_cache.swift \
            -o "$RUNNER_TEMP/test-kenran-buto-aot-cache"
          "$RUNNER_TEMP/test-kenran-buto-aot-cache"

      - name: Detect complete W^X executable-memory provider
        id: executable-memory-provider
        shell: bash
        run: |
          set -euo pipefail
          provider_present=false
          adapter_present=false
          [[ ! -f iSteam/KenranButoAOTExecutableMemory.c ]] || provider_present=true
          [[ ! -f src/Runtime/KenranButoAOTExecution.swift ]] || adapter_present=true
          if [[ "$provider_present" == false && "$adapter_present" == false ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Native AOT execution is not integrated in this revision; decoder and translation-cache tests still run."
          elif [[ "$provider_present" == true && "$adapter_present" == true ]]; then
            if [[ ! -f iSteam/JIT26Protocol.h ]]; then
              echo "::error::Native AOT provider is present without the required JIT26Protocol ABI header."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Native AOT provider integration is partial; the C provider and Swift execution adapter must be present together."
            exit 1
          fi
      - name: Compile W^X executable-memory provider
        if: steps.executable-memory-provider.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -D KENRAN_BUTO_AOT_TESTS -I iSteam \
            -c iSteam/KenranButoAOTExecutableMemory.c \
            -o "$RUNNER_TEMP/kenran-buto-aot-memory.o"
      - name: Execute ABI, AOT block and interpreter side-exit tests on ARM64
        if: steps.executable-memory-provider.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || { echo "Native AOT execution requires an ARM64 runner." >&2; exit 1; }
          swiftc -parse-as-library -swift-version 5 -D KENRAN_BUTO_AOT_TESTS \
            -Xcc -DKENRAN_BUTO_AOT_TESTS \
            -import-objc-header iSteam/JIT26Protocol.h \
            src/Performance/TranslationCache.swift \
            src/Runtime/X86_64AOTTranslator.swift \
            src/Runtime/KenranButoAOTCompiler.swift \
            src/Runtime/KenranButoAOTExecution.swift \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/X86_64Interpreter.swift \
            scripts/tests/test_x86_64_interpreter.swift \
            "$RUNNER_TEMP/kenran-buto-aot-memory.o" \
            -o "$RUNNER_TEMP/test-x86-64-interpreter-aot"
          "$RUNNER_TEMP/test-x86-64-interpreter-aot"

      - name: Run a real static ELF guest through the hybrid interpreter/AOT path
        if: steps.executable-memory-provider.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_hybrid_xchg_smoke_elf.py "$RUNNER_TEMP/hybrid_xchg_smoke.elf"
          python3 scripts/build_hybrid_runtime_smoke_elf.py "$RUNNER_TEMP/hybrid_runtime_smoke.elf"
          python3 scripts/build_hybrid_stdin_smoke_elf.py "$RUNNER_TEMP/hybrid_stdin_smoke.elf"
          swiftc -parse-as-library -swift-version 5 -D KENRAN_BUTO_AOT_TESTS \
            -Xcc -DKENRAN_BUTO_AOT_TESTS \
            -import-objc-header iSteam/JIT26Protocol.h \
            src/Performance/TranslationCache.swift \
            src/Runtime/X86_64AOTTranslator.swift \
            src/Runtime/KenranButoAOTCompiler.swift \
            src/Runtime/KenranButoAOTExecution.swift \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/ELF64Loader.swift \
            src/Runtime/LinuxProcessStackBuilder.swift \
            src/Runtime/X86_64Interpreter.swift \
            scripts/tests/test_static_elf_execution.swift \
            "$RUNNER_TEMP/kenran-buto-aot-memory.o" \
            -o "$RUNNER_TEMP/test-static-elf-aot"
          "$RUNNER_TEMP/test-static-elf-aot" "$RUNNER_TEMP/hybrid_xchg_smoke.elf" "$RUNNER_TEMP/hybrid_runtime_smoke.elf" "$RUNNER_TEMP/hybrid_stdin_smoke.elf"

      - name: Run native GuestMachine stop and pause/resume smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_hybrid_runtime_smoke_elf.py "$RUNNER_TEMP/hybrid_runtime_smoke.elf"
          python3 scripts/build_hybrid_stdin_smoke_elf.py "$RUNNER_TEMP/hybrid_stdin_smoke.elf"
          clang -std=c11 -Wall -Wextra -Werror -D KENRAN_BUTO_AOT_TESTS -I iSteam \
            -c iSteam/KenranButoAOTExecutableMemory.c \
            -o "$RUNNER_TEMP/native-guest-aot-memory.o"
          clang++ -std=c++17 -Wall -Wextra -Werror -pthread -I iSteam \
            -c iSteam/NativeGuestMemory.cpp \
            -o "$RUNNER_TEMP/native-guest-memory.o"
          clang -std=c11 -Wall -Wextra -Werror -I iSteam \
            -c iSteam/NativeEmulation.c \
            -o "$RUNNER_TEMP/native-emulation.o"
          swiftc -parse-as-library -swift-version 5 -D KENRAN_BUTO_AOT_TESTS \
            -Xcc -DKENRAN_BUTO_AOT_TESTS \
            -Xcc -I. \
            -import-objc-header scripts/tests/NativeGuestMachine-Bridging-Header.h \
            src/Core/EmulationLog.swift \
            src/Performance/TranslationCache.swift \
            src/Runtime/X86_64AOTTranslator.swift \
            src/Runtime/KenranButoAOTCompiler.swift \
            src/Runtime/KenranButoAOTExecution.swift \
            src/Runtime/GuestMemory.swift \
            src/Runtime/ELF64Loader.swift \
            src/Runtime/LinuxProcessStackBuilder.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/X86_64Interpreter.swift \
            src/Runtime/GuestMachine.swift \
            scripts/tests/test_native_guest_machine_smoke.swift \
            "$RUNNER_TEMP/native-guest-aot-memory.o" \
            "$RUNNER_TEMP/native-guest-memory.o" \
            "$RUNNER_TEMP/native-emulation.o" \
            -Xlinker -lc++ \
            -o "$RUNNER_TEMP/test-native-guest-machine-smoke"
          "$RUNNER_TEMP/test-native-guest-machine-smoke" \
            "$RUNNER_TEMP/hybrid_runtime_smoke.elf" \
            "$RUNNER_TEMP/hybrid_stdin_smoke.elf"
