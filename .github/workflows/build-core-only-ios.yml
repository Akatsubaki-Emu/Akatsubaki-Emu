name: Build Core-Only iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-core-only-ios.yml'
      - 'docs/FIRST_PLAYABLE_IOS_ACCEPTANCE.md'
      - 'project.yml'
      - 'iSteam/**'
      - 'src/Core/**'
      - 'src/Runtime/**'
      - 'src/Steam/**'
      - 'scripts/tests/**'
      - 'scripts/build_hybrid_xchg_smoke_elf.py'
      - 'scripts/build_hybrid_runtime_smoke_elf.py'
      - 'scripts/validate-qemu-source.py'

permissions:
  contents: read

concurrency:
  group: core-only-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-core-only-ios:
    if: github.ref == 'refs/heads/main'
    name: Build unsigned iOS IPA without QEMU
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode and report toolchain
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          XCODE_REST="${XCODE_VERSION#*.}"
          XCODE_MINOR="${XCODE_REST%%.*}"
          if (( XCODE_MAJOR < 27 || (XCODE_MAJOR == 27 && XCODE_MINOR < 1) )); then
            echo "Xcode 27.1 or newer is required; found $XCODE_VERSION." >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate --spec project.yml

      - name: Verify this is a QEMU-free source build
        shell: bash
        run: |
          set -euo pipefail
          test -f iSteam.xcodeproj/project.pbxproj
          if grep -nE 'QEMU(-TCI|-JIT)?\.framework|QEMU_RUNTIME_MANIFEST|QEMU_EFI' iSteam.xcodeproj/project.pbxproj; then
            echo 'The Xcode project links or embeds QEMU; refusing a core-only build.' >&2
            exit 1
          fi
          test -f src/Runtime/X86_64AOTTranslator.swift
          test -f src/Runtime/LinuxSyscallDispatcher.swift
          test -f src/Runtime/ELF64Loader.swift

      - name: Run AOT executable arena allocator regression tests
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -Wall -Wextra -Werror -pthread -IiSteam iSteam/AOTExecutableArena.c scripts/tests/test_aot_executable_arena.c -o /tmp/kenran-aot-arena-tests
          /tmp/kenran-aot-arena-tests

      - name: Run repository source-contract and Python regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-qemu-source.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Run AOT translator regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/akatsubaki-core-tests"
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/X86_64AOTTranslator.swift \
            scripts/tests/test_kenran_buto_aot_translator.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/aot-translator-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/aot-translator-tests"

      - name: Run x86-64 interpreter regression tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/X86_64Interpreter.swift \
            scripts/tests/test_x86_64_interpreter.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/interpreter-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/interpreter-tests"

      - name: Run translation cache and AOT artifact cache tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Core/EmulationLog.swift \
            src/Performance/TranslationCache.swift \
            scripts/tests/test_translation_cache.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/translation-cache-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/translation-cache-tests"
          swiftc -parse-as-library -swift-version 5 \
            src/Core/EmulationLog.swift \
            src/Performance/TranslationCache.swift \
            src/Runtime/X86_64AOTTranslator.swift \
            src/Runtime/KenranButoAOTCompiler.swift \
            scripts/tests/test_kenran_buto_aot_cache.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/aot-cache-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/aot-cache-tests"

      - name: Run ELF headers, Linux syscall and process-stack tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/ELF64Loader.swift \
            scripts/tests/test_elf_loader_program_headers.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/elf-phdr-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/elf-phdr-tests"
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/LinuxSyscallDispatcher.swift \
            scripts/tests/test_linux_syscall_dispatcher.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/linux-syscall-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/linux-syscall-tests"
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/LinuxProcessStackBuilder.swift \
            scripts/tests/test_linux_process_stack.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/linux-process-stack-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/linux-process-stack-tests"

      - name: Run production native guest-memory regression tests
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -Wall -Wextra -Werror -pthread -DISTEAM_GUEST_MEMORY_TESTING -I iSteam \
            iSteam/NativeGuestMemory.cpp scripts/tests/test_native_guest_memory.cpp \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-memory-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-memory-tests"
          clang++ -std=c++17 -Wall -Wextra -Werror -pthread -I iSteam -c \
            iSteam/NativeGuestMemory.cpp \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-memory.o"
          swiftc -parse-as-library -swift-version 5 \
            -import-objc-header iSteam/NativeGuestMemory.h \
            src/Runtime/GuestMemory.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            scripts/tests/test_guest_memory_native_integration.swift \
            "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-memory.o" \
            -Xlinker -lc++ \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-memory-integration"
          "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-memory-integration"

      - name: Build diagnostic static Linux guests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_hybrid_xchg_smoke_elf.py "$RUNNER_TEMP/hybrid_xchg_smoke.elf"
          python3 scripts/build_hybrid_runtime_smoke_elf.py "$RUNNER_TEMP/hybrid_runtime_smoke.elf"

      - name: Run static ELF loader and syscall execution tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/ELF64Loader.swift \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/LinuxProcessStackBuilder.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/X86_64Interpreter.swift \
            scripts/tests/test_static_elf_execution.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/static-elf-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/static-elf-tests" "$RUNNER_TEMP/hybrid_xchg_smoke.elf" "$RUNNER_TEMP/hybrid_runtime_smoke.elf"

      - name: Execute ELF through native GuestMachine and C-backed guest memory
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            -import-objc-header iSteam/NativeGuestMemory.h \
            src/Core/EmulationLog.swift \
            src/Runtime/GuestMemory.swift \
            src/Runtime/GuestMachine.swift \
            src/Runtime/ELF64Loader.swift \
            src/Runtime/LinuxProcessStackBuilder.swift \
            src/Runtime/LinuxSyscallDispatcher.swift \
            src/Runtime/X86_64ALU.swift \
            src/Runtime/X86_64Interpreter.swift \
            scripts/tests/test_native_guest_machine_smoke.swift \
            "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-memory.o" \
            -Xlinker -lc++ \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-machine-smoke"
          "$RUNNER_TEMP/akatsubaki-core-tests/native-guest-machine-smoke" "$RUNNER_TEMP/hybrid_runtime_smoke.elf"

      - name: Run hybrid backend routing tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            src/Runtime/ExecutionBackendRouter.swift \
            scripts/tests/test_execution_backend_router.swift \
            -o "$RUNNER_TEMP/akatsubaki-core-tests/backend-router-tests"
          "$RUNNER_TEMP/akatsubaki-core-tests/backend-router-tests"

      - name: Test LocalDevVPN callback status handling
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library -swift-version 5 \
            iSteam/LocalDevVPNCallback.swift \
            scripts/tests/test_localdevvpn_callback.swift \
            -o "$RUNNER_TEMP/localdevvpn-callback-tests"
          "$RUNNER_TEMP/localdevvpn-callback-tests"

      - name: Build iOS device app without code signing
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/akatsubaki-core-only-derived"
          mkdir -p "$RUNNER_TEMP/akatsubaki-core-only-logs"
          set -o pipefail
          xcodebuild \
            -project iSteam.xcodeproj \
            -scheme iSteam \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/akatsubaki-core-only-logs/xcodebuild.log"
          APP_PATH="$(find "$DERIVED/Build/Products" -maxdepth 3 -type d -path '*/Release-iphoneos/*.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned QEMU-free IPA
        shell: bash
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist-core-only"
          STAGE="$RUNNER_TEMP/akatsubaki-core-only-stage"
          rm -rf "$DIST" "$STAGE"
          mkdir -p "$DIST" "$STAGE/Payload"
          ditto "$APP_PATH" "$STAGE/Payload/$(basename "$APP_PATH")"
          (
            cd "$STAGE"
            /usr/bin/zip -qry "$DIST/Akatsubaki-Emu-CoreOnly-iOS.ipa" Payload
          )
          cp docs/CORE_ONLY_IOS_TEST_BUILD.md "$DIST/README.md"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "QEMU runtime embedded: no"
            echo "Signing: unsigned; install with SideStore or another permitted signer"
          } > "$DIST/build-info.txt"
          cp "$RUNNER_TEMP/akatsubaki-core-only-logs/xcodebuild.log" "$DIST/xcodebuild.log"
          cp "$RUNNER_TEMP/hybrid_xchg_smoke.elf" "$DIST/hybrid_xchg_smoke.elf"
          cp scripts/build_hybrid_xchg_smoke_elf.py "$DIST/build_hybrid_xchg_smoke_elf.py"
          cp scripts/tests/test_hybrid_xchg_smoke_elf.py "$DIST/test_hybrid_xchg_smoke_elf.py"
          shasum -a 256 "$DIST/hybrid_xchg_smoke.elf" > "$DIST/hybrid_xchg_smoke.elf.sha256"
          cp "$RUNNER_TEMP/hybrid_runtime_smoke.elf" "$DIST/hybrid_runtime_smoke.elf"
          cp scripts/build_hybrid_runtime_smoke_elf.py "$DIST/build_hybrid_runtime_smoke_elf.py"
          cp scripts/tests/test_hybrid_runtime_smoke_elf.py "$DIST/test_hybrid_runtime_smoke_elf.py"
          shasum -a 256 "$DIST/hybrid_runtime_smoke.elf" > "$DIST/hybrid_runtime_smoke.elf.sha256"
          echo "Smoke guest: hybrid_xchg_smoke.elf (static x86-64 Linux)" >> "$DIST/build-info.txt"
          echo "Smoke guest expected output: KENRAN_BUTO_XCHG_OK" >> "$DIST/build-info.txt"
          echo "Runtime smoke guest: hybrid_runtime_smoke.elf (uname/write/exit, RX+RW PT_LOAD)" >> "$DIST/build-info.txt"
          echo "Runtime smoke guest expected output: Linuxx86_64KENRAN_BUTO_RUNTIME_OK" >> "$DIST/build-info.txt"

      - name: Validate core-only IPA
        shell: bash
        run: bash scripts/validate-core-only-ipa.sh dist-core-only/Akatsubaki-Emu-CoreOnly-iOS.ipa

      - name: Upload private test-build artifact (not a release)
        uses: actions/upload-artifact@v7
        with:
          name: Akatsubaki-Emu-CoreOnly-iOS-${{ github.run_number }}
          path: dist-core-only/
          if-no-files-found: error
          retention-days: 7
