name: Build UTM iOS QEMU runtime (manual)

on:
  workflow_dispatch:
    inputs:
      rebuild_dependencies:
        description: Rebuild UTM dependencies instead of reusing the runner cache
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      rebuild_dependencies:
        description: Rebuild UTM dependencies instead of reusing the runner cache
        type: boolean
        required: false
        default: false

permissions:
  contents: read


jobs:
  build-utm-runtime:
    runs-on: xcode-27
    timeout-minutes: 350
    steps:
      - name: Checkout Akatsubaki Emu
        uses: actions/checkout@v7

      # Recheck after this job obtains an Xcode runner. A queued job can become
      # stale after the parent workflow's lightweight freshness check.
      - name: scripts/check-build-freshness.sh
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          build_current="$(bash scripts/check-build-freshness.sh "$GITHUB_SHA")"
          echo "build=$build_current" >> "$GITHUB_OUTPUT"
          if [ "$build_current" != "true" ]; then
            echo "Skipping this QEMU build because a newer build-relevant main commit exists."
          fi

      - name: Checkout UTM with submodules
        if: steps.freshness.outputs.build == 'true'
        id: utm-source
        uses: actions/checkout@v7
        with:
          repository: utmapp/UTM
          ref: main
          path: UTM
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        if: steps.freshness.outputs.build == 'true'
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR="$(xcode-select -p)"
          if [ ! -d "$XCODE_DEVELOPER_DIR" ]; then
            echo "The xcode-27 runner has no active Xcode developer directory." >&2
            exit 1
          fi
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          case "$XCODE_VERSION" in
            27.*) ;;
            *)
              echo "Expected Xcode 27.x on the xcode-27 runner, selected $XCODE_VERSION." >&2
              exit 1
              ;;
          esac
          echo "Using Xcode $XCODE_VERSION at $XCODE_DEVELOPER_DIR"
          xcodebuild -version
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "version=${XCODE_VERSION}-ios-${IOS_SDK_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify Objective-C class-selector stub compatibility
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          PROBE_SOURCE="$RUNNER_TEMP/objc-class-selector-stub-probe.m"
          PROBE_OBJECT="$RUNNER_TEMP/objc-class-selector-stub-probe.o"
          PROBE_BINARY="$RUNNER_TEMP/objc-class-selector-stub-probe"
          cat > "$PROBE_SOURCE" <<'EOF'
          #import <Metal/Metal.h>
          id iSteamClassSelectorStubProbe(void) {
              return [MTLRenderPassDescriptor renderPassDescriptor];
          }
          int main(void) {
              return iSteamClassSelectorStubProbe() == nil;
          }
          EOF
          "$CLANG" -target arm64-apple-ios15.0 -isysroot "$SDKROOT" \
            -fno-objc-msgsend-class-selector-stubs -c "$PROBE_SOURCE" -o "$PROBE_OBJECT"
          SYMBOLS="$(xcrun --sdk iphoneos nm -u "$PROBE_OBJECT")"
          if grep -Fq '_objc_msgSendClass' <<<"$SYMBOLS"; then
            echo "Xcode still emitted an Objective-C class-selector stub that the selected linker cannot resolve." >&2
            exit 1
          fi
          "$CLANG" -target arm64-apple-ios15.0 -isysroot "$SDKROOT" \
            -Wl,-objc_stubs_fast -lobjc -framework Metal "$PROBE_OBJECT" -o "$PROBE_BINARY"
          echo "Verified the Objective-C class-selector compiler and linker flags on the iOS toolchain."

      - name: Verify iOS vm_map compatibility
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          PROBE_SOURCE="$RUNNER_TEMP/ios-vm-map-compat-probe.c"
          cat > "$PROBE_SOURCE" <<'EOF'
          #include <TargetConditionals.h>
          #include <mach/mach_init.h>
          #include <mach/vm_map.h>
          #define mach_vm_address_t vm_address_t
          #define mach_vm_offset_t vm_offset_t
          #define mach_vm_size_t vm_size_t
          #define mach_vm_remap vm_remap
          #define mach_vm_protect vm_protect
          #define mach_vm_deallocate vm_deallocate
          extern kern_return_t mach_vm_remap(vm_map_t target_task,
              mach_vm_address_t *target_address, mach_vm_size_t size,
              mach_vm_offset_t mask, int flags, vm_map_t source_task,
              mach_vm_address_t source_address, boolean_t copy,
              vm_prot_t *cur_protection, vm_prot_t *max_protection,
              vm_inherit_t inheritance);
          extern kern_return_t mach_vm_protect(vm_map_t target_task,
              mach_vm_address_t address, mach_vm_size_t size,
              boolean_t set_maximum, vm_prot_t new_protection);
          extern kern_return_t mach_vm_deallocate(vm_map_t target_task,
              mach_vm_address_t address, mach_vm_size_t size);
          int main(void) {
              vm_address_t target = 0;
              vm_prot_t current = VM_PROT_READ;
              vm_prot_t maximum = VM_PROT_READ | VM_PROT_WRITE;
              (void)mach_vm_remap(mach_task_self(), &target, 4096, 0,
                  VM_FLAGS_ANYWHERE, mach_task_self(), 0, FALSE, &current,
                  &maximum, VM_INHERIT_NONE);
              (void)mach_vm_protect(mach_task_self(), target, 4096, FALSE,
                  VM_PROT_READ);
              (void)mach_vm_deallocate(mach_task_self(), target, 4096);
              return 0;
          }
          EOF
          "$CLANG" -target arm64-apple-ios16.0 -isysroot "$SDKROOT" -fsyntax-only "$PROBE_SOURCE"

      - name: Install UTM build dependencies
        if: steps.freshness.outputs.build == 'true'
        run: |
          set -euo pipefail
          brew install bison pkg-config gettext glib libgpg-error nasm meson cmake llvm spirv-llvm-translator spirv-tools libxcb libxrandr
          python3 -m pip install --break-system-packages six pyparsing pyyaml setuptools distlib mako
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

          # UTM's QEMU link step uses platform-availability checks. Homebrew LLVM
          # does not ship an iOS compiler-rt, so force-load Apple's iOS runtime
          # from the active Xcode toolchain when the linker builds QEMU dylibs.
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          RESOURCE_DIR="$("$CLANG" -print-resource-dir)"
          RUNTIME="$RESOURCE_DIR/lib/darwin/libclang_rt.ios.a"
          if [ ! -f "$RUNTIME" ]; then
            RUNTIME="$(find "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" -path '*/lib/darwin/libclang_rt.ios.a' -print -quit)"
          fi
          if [ -z "$RUNTIME" ] || [ ! -f "$RUNTIME" ]; then
            echo "Apple's libclang_rt.ios.a was not found in the selected Xcode toolchain." >&2
            exit 1
          fi
          echo "IOS_COMPILER_RT=$RUNTIME" >> "$GITHUB_ENV"
          echo "Using iOS compiler runtime: $RUNTIME"

      - name: Cache UTM dependency build and sysroot
        if: ${{ steps.freshness.outputs.build == 'true' && !inputs.rebuild_dependencies }}
        uses: actions/cache@v6
        with:
          path: |
            UTM/build-iOS-arm64
            UTM/sysroot-iOS-arm64
            UTM/build-iOS-TCI-arm64
            UTM/sysroot-iOS-TCI-arm64
          # Include the workflow itself: Meson cross-file fixes change build configuration.
          # A workflow-only fix must not reuse a QEMU build tree configured without it.
          key: utm-ios-arm64-deps-v15-${{ steps.utm-source.outputs.commit }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('.github/workflows/build-qemu-runtime.yml', 'scripts/package-utm-qemu-runtime.sh', 'scripts/package-utm-qemu-tci-runtime.sh', 'scripts/merge-qemu-runtime-variants.sh', 'scripts/patch_utm_qemu_ios.py', 'scripts/patch_qemu_stikjit_ios.py', 'scripts/patch_qemu_tci_exports.py', 'scripts/patch_qemu_meson_ios.py', 'scripts/verify_qemu_meson_link.py') }}

      - name: Build UTM dependencies for physical iOS arm64
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        env:
          NCPU: "2"
          ISTEAM_QEMU_JIT_PATCHER: ${{ github.workspace }}/scripts/patch_qemu_stikjit_ios.py
          ISTEAM_QEMU_MESON_PATCHER: ${{ github.workspace }}/scripts/patch_qemu_meson_ios.py
          ISTEAM_QEMU_LINK_VERIFIER: ${{ github.workspace }}/scripts/verify_qemu_meson_link.py
        run: |
          set -euo pipefail
          cd UTM
          # Use regular Objective-C selector stubs supported by the selected Xcode linker.
          export OBJCFLAGS="${OBJCFLAGS:-} -fno-objc-msgsend-class-selector-stubs"
          # Patch QEMU's iOS 26+ TCG JIT allocator and Meson project, then verify the generated
          # QEMU dylib link edge before its compile/link tasks start.
          python3 "$GITHUB_WORKSPACE/scripts/patch_utm_qemu_ios.py" scripts/build_dependencies.sh
          if [ "${{ inputs.rebuild_dependencies }}" = "true" ] || [ ! -f build-iOS-arm64/BUILD_SUCCESS ]; then
            ./scripts/build_dependencies.sh -p ios -a arm64
          else
            echo "Using the cached iOS arm64 dependency build."
          fi
          test -f build-iOS-arm64/BUILD_SUCCESS
          test -d sysroot-iOS-arm64

      - name: Build UTM TCI dependencies for physical iOS arm64
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        env:
          NCPU: "2"
          ISTEAM_QEMU_TCI_EXPORT_PATCHER: ${{ github.workspace }}/scripts/patch_qemu_tci_exports.py
          ISTEAM_QEMU_MESON_PATCHER: ${{ github.workspace }}/scripts/patch_qemu_meson_ios.py
          ISTEAM_QEMU_LINK_VERIFIER: ${{ github.workspace }}/scripts/verify_qemu_meson_link.py
        run: |
          set -euo pipefail
          cd UTM
          export OBJCFLAGS="${OBJCFLAGS:-} -fno-objc-msgsend-class-selector-stubs"
          # ios-tci selects the threaded interpreter; export QEMU shutdown and omit the StikJIT callback.
          python3 "$GITHUB_WORKSPACE/scripts/patch_utm_qemu_ios.py" scripts/build_dependencies.sh
          if [ "${{ inputs.rebuild_dependencies }}" = "true" ] || [ ! -f build-iOS-TCI-arm64/BUILD_SUCCESS ]; then
            ./scripts/build_dependencies.sh -p ios-tci -a arm64
          else
            echo "Using the cached iOS TCI arm64 dependency build."
          fi
          test -f build-iOS-TCI-arm64/BUILD_SUCCESS
          test -d sysroot-iOS-TCI-arm64

      - name: Build UTM iOS archive
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd UTM
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTMBuild
          test -d UTMBuild.xcarchive/Products/Applications/UTM.app

      - name: Build UTM iOS TCI archive
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd UTM
          ./scripts/build_utm.sh -k iphoneos -s iOS-SE -a arm64 -o UTMBuildTCI
          test -d 'UTMBuildTCI.xcarchive/Products/Applications/UTM SE.app'

      - name: Package and verify in-process QEMU runtime
        if: steps.freshness.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-utm-qemu-runtime.sh UTM/UTMBuild.xcarchive build/qemu-runtime-jit
          bash scripts/package-utm-qemu-tci-runtime.sh UTM/UTMBuildTCI.xcarchive build/qemu-runtime-tci

          git -C UTM rev-parse HEAD > build/qemu-runtime-jit/UTM-SOURCE-REVISION.txt
          git -C UTM rev-parse HEAD > build/qemu-runtime-tci/UTM-SOURCE-REVISION.txt
          cp UTM/UTMBuild.xcarchive/Info.plist build/qemu-runtime-jit/UTM-archive-Info.plist
          cp UTM/UTMBuildTCI.xcarchive/Info.plist build/qemu-runtime-tci/UTM-archive-Info.plist

          bash scripts/merge-qemu-runtime-variants.sh build/qemu-runtime-jit build/qemu-runtime-tci build/qemu-runtime
          for mode in JIT TCI; do
            mode_dir="build/qemu-runtime/QEMU/$mode"
            manifest="$mode_dir/runtime-library-path.txt"
            exports="$mode_dir/exports.txt"
            test -s "$manifest" || { echo "Missing $mode runtime manifest." >&2; exit 1; }
            test -s "$exports" || { echo "Missing $mode export manifest." >&2; exit 1; }
            runtime_rel="$(head -n 1 "$manifest")"
            case "$runtime_rel" in
              Frameworks/*) ;;
              *) echo "Unsafe $mode runtime path: $runtime_rel" >&2; exit 1 ;;
            esac
            test -s "build/qemu-runtime/$runtime_rel" || { echo "Missing $mode runtime library: $runtime_rel" >&2; exit 1; }
            for symbol in qemu_init qemu_main_loop qemu_cleanup qemu_system_shutdown_request; do
              grep -Eq "[[:space:]]_?${symbol}$" "$exports" || { echo "$mode runtime is missing $symbol." >&2; exit 1; }
            done
            if [ "$mode" = "JIT" ]; then
              grep -Eq '[[:space:]]_?isteam_qemu_set_jit_callbacks$' "$exports" || { echo "JIT callback export is missing." >&2; exit 1; }
            elif grep -Eq '[[:space:]]_?isteam_qemu_set_jit_callbacks$' "$exports"; then
              echo "TCI runtime must not export the JIT callback." >&2
              exit 1
            fi
          done
          echo "Physical iOS arm64 runtime variants: JIT and TCI"

      - name: Upload verified QEMU runtime artifact
        if: steps.freshness.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: AkatsubakiEmu-qemu-runtime-ios-arm64
          path: build/qemu-runtime/
          if-no-files-found: error
          retention-days: 14
